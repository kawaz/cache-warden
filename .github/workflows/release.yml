name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # bump-semver の `vcs get latest-tag` で全 tag が必要

      # semver gate 用に bump-semver を install (latest release を利用)
      - name: Install bump-semver
        run: |
          set -euo pipefail
          LATEST=$(gh release list --repo kawaz/bump-semver --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          curl -fsSL --retry 5 --retry-delay 2 --max-time 60 \
            "https://github.com/kawaz/bump-semver/releases/download/v${LATEST}/bump-semver-linux-amd64" \
            -o /usr/local/bin/bump-semver
          chmod +x /usr/local/bin/bump-semver
          bump-semver --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check version change
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          # semver 形式の検証 (bump-semver get -qq で exit code のみ検証)
          if ! bump-semver get "$CURRENT_VERSION" -qq; then
            echo "::error::Invalid version format in Cargo.toml: ${CURRENT_VERSION}"
            exit 1
          fi

          # 既 release 済みなら green skip (= semver gate より前に置く)
          #
          # Design rationale: canonical (kawaz/bump-semver) は gate を先に置き
          # not-greater を常に赤にするが、それは trigger が paths:["VERSION"]
          # で同 version の再発火が起きない前提。cache-warden の trigger は
          # paths:["Cargo.toml"] で、依存変更のみの push でも発火する (= 同
          # version での再発火が正常系)。先に既 release 確認で green skip
          # しないと、依存変更 push のたびに CI が赤になる。
          if gh release view "v${CURRENT_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: v${CURRENT_VERSION} already released"
            exit 0
          fi

          # ---- semver gate (= release.yml canonical pattern) ----
          #
          # CURRENT_VERSION が「過去の release / tag いずれよりも大」を
          # 並列 check する。両 source を短絡せず評価し、どちらかの gate を
          # 越えなかったら release を作らない (= downgrade を止める):
          #   - latest-release: GH の release 一覧 (= 過去リリース済 versions)
          #   - latest-tag    : git tag (= origin の git ref)
          #
          # なぜ両方必要か: `gh release create` は GH 内部に release + tag を
          # 作るが origin の git ref には tag を push しない (cli/cli#4357)。
          # よって checkout 後の `vcs get latest-tag` は GH の最新 release より
          # 古い tag を返すケースがあり、そのギャップを `latest-release` が埋める。
          #
          # なぜ `gh` の `--latest=automatic` に任せないか: date を含む
          # スコアリング (= SemVer 厳格でない) で後発の小 version が Latest に
          # 昇格する観測あり。後段 (homebrew tap 更新等) は現 push version を
          # 信用するため、この段階で gate して release を作らせない。
          #
          # 初回 release / bootstrap: latest-release / latest-tag のどちらも
          # 空 (= exit 非 0) はあり得る。その軸の gate は skip、他方の軸だけで判定。
          FAIL=0
          if LATEST_REL=$(bump-semver vcs get latest-release --repository "$REPO" 2>/dev/null); then
            echo "latest-release: ${LATEST_REL}"
            if ! bump-semver compare gt "$CURRENT_VERSION" "$LATEST_REL" -qq; then
              echo "::error::v${CURRENT_VERSION} is not greater than latest GH release v${LATEST_REL}"
              FAIL=1
            fi
          else
            echo "latest-release: (none yet); bootstrap"
          fi
          if LATEST_TAG=$(bump-semver vcs get latest-tag --include-prerelease --vcs git 2>/dev/null); then
            echo "latest-tag: ${LATEST_TAG}"
            if ! bump-semver compare gt "$CURRENT_VERSION" "$LATEST_TAG" -qq; then
              echo "::error::v${CURRENT_VERSION} is not greater than latest git tag v${LATEST_TAG}"
              FAIL=1
            fi
          else
            echo "latest-tag: (none yet); bootstrap"
          fi
          if [ "$FAIL" = "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "New version detected: v${CURRENT_VERSION}"

  build-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl') && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p cache-warden-cli
          else
            cargo build --release --target ${{ matrix.target }} -p cache-warden-cli
          fi
          # The approver helper (TouchID dialogs, DR-0031) ships inside the
          # macOS .app bundle only — it is AppKit code with no other platform.
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release --target ${{ matrix.target }} -p cache-warden-approver
          fi

      - name: Create .app bundle (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p CacheWarden.app/Contents/MacOS
          cp cache-warden CacheWarden.app/Contents/MacOS/
          cat > CacheWarden.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>cache-warden</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.kawaz.cache-warden</string>
            <key>CFBundleName</key>
            <string>cache-warden</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>LSBackgroundOnly</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Bundle approver helper (macOS)
        if: runner.os == 'macOS'
        run: |
          # Nested helper app at the path the daemon probes
          # (resolve_approver_helper_path). Info.plist is the checked-in one
          # (LSUIElement etc.) — same assembly as the dev `just approver-run`.
          cd target/${{ matrix.target }}/release
          HELPER_APP="CacheWarden.app/Contents/Helpers/CacheWardenApprover.app"
          mkdir -p "$HELPER_APP/Contents/MacOS"
          cp "$GITHUB_WORKSPACE/crates/cache-warden-approver/Info.plist" "$HELPER_APP/Contents/Info.plist"
          printf 'APPL????' > "$HELPER_APP/Contents/PkgInfo"
          cp cache-warden-approver "$HELPER_APP/Contents/MacOS/cache-warden-approver"

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Sign .app bundle (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Sign bottom-up: innermost binaries first, then their bundles,
          # then the outer .app (a nested bundle must be sealed before the
          # outer signature covers it).
          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --force \
            --timestamp \
            target/${{ matrix.target }}/release/CacheWarden.app/Contents/Helpers/CacheWardenApprover.app/Contents/MacOS/cache-warden-approver

          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --force \
            --timestamp \
            target/${{ matrix.target }}/release/CacheWarden.app/Contents/Helpers/CacheWardenApprover.app

          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --force \
            --timestamp \
            target/${{ matrix.target }}/release/CacheWarden.app/Contents/MacOS/cache-warden

          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --force \
            --timestamp \
            target/${{ matrix.target }}/release/CacheWarden.app

          echo "Signed .app bundle:"
          codesign -dv --verbose=2 target/${{ matrix.target }}/release/CacheWarden.app

      - name: Notarize binary (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain $RUNNER_TEMP/app-signing.keychain-db

          cd target/${{ matrix.target }}/release
          ditto -c -k --keepParent CacheWarden.app notarize.zip

          xcrun notarytool submit notarize.zip \
            --keychain-profile "notary-profile" \
            --keychain $RUNNER_TEMP/app-signing.keychain-db \
            --wait \
            --timeout 10m

          xcrun stapler staple CacheWarden.app

          rm notarize.zip
          echo "Notarization complete"

      - name: Clean up keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          if [ -d "CacheWarden.app" ]; then
            # Include both .app bundle and bare binary so Homebrew doesn't
            # auto-strip the single top-level directory (CacheWarden.app)
            tar czf ../../../cache-warden-${{ matrix.target }}.tar.gz CacheWarden.app cache-warden
          else
            tar czf ../../../cache-warden-${{ matrix.target }}.tar.gz cache-warden
          fi
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: cache-warden-${{ matrix.target }}
          path: cache-warden-${{ matrix.target }}.tar.gz

  publish-release:
    needs: [check-version, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release with tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            cache-warden-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --target "$COMMIT_SHA" \
            --generate-notes

  update-homebrew:
    needs: [check-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate checksums
        id: checksums
        run: |
          echo "darwin_arm64=$(sha256sum artifacts/cache-warden-aarch64-apple-darwin/*.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$(sha256sum artifacts/cache-warden-x86_64-apple-darwin/*.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(sha256sum artifacts/cache-warden-x86_64-unknown-linux-gnu/*.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(sha256sum artifacts/cache-warden-aarch64-unknown-linux-gnu/*.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: echo "version=${{ needs.check-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: kawaz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: "Remove stale formula (Cask only)"
        run: rm -f homebrew-tap/Formula/cache-warden.rb

      - name: Update cask
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/cache-warden.rb << 'CASK'
          cask "cache-warden" do
            version "${{ steps.version.outputs.version }}"

            on_arm do
              sha256 "${{ steps.checksums.outputs.darwin_arm64 }}"
              url "https://github.com/kawaz/cache-warden/releases/download/v#{version}/cache-warden-aarch64-apple-darwin.tar.gz"
            end
            on_intel do
              sha256 "${{ steps.checksums.outputs.darwin_amd64 }}"
              url "https://github.com/kawaz/cache-warden/releases/download/v#{version}/cache-warden-x86_64-apple-darwin.tar.gz"
            end

            name "cache-warden"
            desc "Securely caches secrets with TTL, process-aware access control, and reauth"
            homepage "https://github.com/kawaz/cache-warden"

            app "CacheWarden.app"
            binary "#{appdir}/CacheWarden.app/Contents/MacOS/cache-warden"
          end
          CASK

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula/ Casks/cache-warden.rb
          git diff --staged --quiet || git commit -m "Update cache-warden to ${{ steps.version.outputs.version }}"
          git push
