[package]
name = "cache-warden-approver-poc"
version.workspace = true
edition.workspace = true
publish = false
description = "draft-DR-0031 案 A (Rust 統一) の PoC gate 検証用バイナリ。LAAuthenticationView + LAContext.evaluatePolicy の埋め込み可否を build レベルで確認する最小実装。"

[[bin]]
name = "cache-warden-approver-poc"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSString",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSStackView",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }
objc2-local-authentication-embedded-ui = { version = "0.3", features = [
    "LAAuthenticationView",
] }
