[package]
name = "cache-warden-vault"
version.workspace = true
edition.workspace = true
description = "Encrypted persistent vault for cw-owned secrets: multi-slot asymmetric recipients, DEK rotation, atomic durable commit"
license = "MIT"
repository = "https://github.com/kawaz/cache-warden"

[dependencies]
# The core's mlock-pinned, zeroize-on-drop secret holder (DR-0007 / DR-0028).
# The unlocked DEK lives in one of these; the dependency is deliberately
# one-directional (the core knows nothing about the vault).
cache-warden = { path = "../cache-warden" }
# AEAD for the body and for every key-wrapping step (DR-0034 §1a, aead_alg_id
# v1 = XChaCha20-Poly1305). XChaCha's 192-bit nonce makes random per-message
# nonces safe without a counter, which the rotate-and-rewrite commit model needs.
chacha20poly1305 = "0.10"
# HKDF-SHA256: slot KEK derivation (DR-0034 §2) and the ECIES DEK-wrap KDF.
hkdf = "0.12"
sha2 = "0.10"
# X25519 recipients: each slot is an asymmetric recipient so DEK rotation and
# slot addition need public keys only (DR-0034 §1b).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# `OsRng` for every key, salt, nonce, id and recovery code. Version pinned to
# the workspace's existing rand_core generation (see the note below).
rand_core = { version = "0.6", features = ["getrandom"] }
# Wipes DEK / private key / plaintext buffers; the "serde" feature gives
# `Zeroizing<Vec<u8>>` its Serialize/Deserialize used by the body schema.
zeroize = { version = "1", features = ["serde"] }
# Constant-time comparison of claim tokens (DR-0034 §4). Already in the tree
# via curve25519-dalek, so this adds no new crate to the dependency graph.
subtle = "2"
# Body plaintext schema (DR-0034 §1d). serde_json matches the DR-0029 snapshot's
# encoding so the two "carry state across a restart" formats stay legible to the
# same tooling.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Design rationale: these crypto crates are pinned to the RustCrypto generation
# the workspace already resolves (digest 0.10 / rand_core 0.6 /
# curve25519-dalek 4, pulled in by cache-warden-authsock's ed25519-dalek 2),
# not to the newest published majors (chacha20poly1305 0.11 / hkdf 0.13 /
# x25519-dalek 3). Taking the newer majors would put two copies of
# curve25519-dalek, sha2, digest and rand_core in the tree — a duplicated
# audit surface and two independent RustCrypto advisory streams to track for a
# crate whose whole job is key handling. Stepping the workspace up as a single
# unit is the follow-up; splitting it across generations is not.

[dev-dependencies]
tempfile = "3"
# The software authenticator that drives the passkey-slot tests without a
# browser (DR-0034 Open Q5). Dev-only: the vault itself never verifies a
# WebAuthn ceremony, it only consumes the PRF output one produced.
cache-warden-webauthn = { path = "../cache-warden-webauthn" }
