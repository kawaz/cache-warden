[package]
name = "cache-warden-approver"
version.workspace = true
edition.workspace = true
publish = false
description = "cache-warden の常駐 GUI helper (custom TouchID 承認 dialog)。draft-DR-0031 案 A (Rust + objc2 統一) の本実装。daemon (cache-warden) と unix socket で ApproveRequest/Response を交換し、LAAuthenticationView 埋め込みの独自 dialog で承認を取る。"
# build.rs の追加で cargo が git 経由の file listing に落ちて bare repo (jj 兼用の
# workspace root) と衝突するのを回避するため include を明示する。
include = [
    "src/**/*",
    "build.rs",
    "Info.plist",
    "Cargo.toml",
]

[lib]
name = "cache_warden_approver"
path = "src/lib.rs"

[[bin]]
name = "cache-warden-approver"
path = "src/main.rs"

# Wire schema types only (draft-DR-0031 §4): plain data, no macOS-specific
# deps, so this crate's lib target (and anything depending on it, e.g.
# cache-warden-cli) builds on every platform even though the bin target below
# is macOS-only.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Peer code-signature identity check on the approver socket
# (draft-DR-0031 §Security). Confined to macOS: the helper itself is
# macOS-only (LocalAuthenticationEmbeddedUI), so there is no non-macOS build
# to keep green here — unlike the daemon side, which needs the shim.
macos-process-inspect = { path = "../macos-process-inspect" }
# Full Disk Access probe for the explainer window's live status
# (the helper re-checks TCC itself rather than trusting a state the daemon
# sampled before the window was even on screen).
macos-tcc = { path = "../macos-tcc" }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSDistributedNotificationCenter",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSResponder",
    "NSStackView",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }
objc2-local-authentication-embedded-ui = { version = "0.3", features = [
    "LAAuthenticationView",
] }
